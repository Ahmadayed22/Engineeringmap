spring.application.name=server

# ===============================
# = DATABASE CONFIGURATION =
# ===============================
# Use environment variables for database connection
# For local development set DATABASE_URL, DB_USERNAME and DB_PASSWORD in your environment.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# = JPA / HIBERNATE CONFIGURATION =
# ===============================
# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks that the
# entities match it and refuses to start if they don't. Change the schema with a new V<n>__*.sql file.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# = FLYWAY MIGRATIONS =
# ===============================
# Databases created by the old ddl-auto=update (no flyway_schema_history table yet) are marked as
# version 1 on first start, so V1 is skipped there and only later migrations run.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ===============================
# = JWT CONFIGURATION =
# ===============================
jwt.secret=${JWT_SECRET}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION:900000} 
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000} 
spring.task.scheduling.pool.size=2

# ===============================
# = SERVER CONFIGURATION =
# ===============================
server.port=${PORT:8080}

# ===============================
# = REACT FRONTEND BUILD LOCATION =
# ===============================
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.add-mappings=true

# Never send stack traces or exception messages to clients
server.error.include-stacktrace=never
server.error.include-message=never

# Compress text responses (JS, CSS, JSON)
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml