# Local profile: runs the API against an in-memory H2 database with demo data.
# Start with:
#   mvn spring-boot:run -Dspring-boot.run.useTestClasspath=true -Dspring-boot.run.profiles=local
# Nothing here is used in production (this file lives in src/test).
spring.datasource.url=jdbc:h2:mem:engmap;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Same as production: Flyway builds the schema (and seeds the roles), Hibernate validates it.
# db/local adds the demo data as a repeatable migration that runs after the real ones.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration,classpath:db/local

# Local-only signing key (base64). Never reuse in production.
jwt.secret=bG9jYWwtZGV2ZWxvcG1lbnQtb25seS1zZWNyZXQta2V5LW5vdC1mb3ItcHJvZHVjdGlvbg==
jwt.access.expiration=900000
jwt.refresh.expiration=604800000
